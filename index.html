<html lang="pt-BR">
<head>

<style>
/* cores semânticas também em azul; o vermelho fica só para erros do sistema e a ação de apagar */
:root{
  --navy:#0b2545;--navy2:#13315c;--blue:#1d4e89;--mid:#3a6ea5;--sky:#7fb8e6;--pastel:#a9d3f2;--baby:#cfe6f7;--baby2:#eaf5fd;
  --bg:#f3f8fc;--card:#fff;--line:#e3edf6;--text:#0b2545;--muted:#647b97;--ok:#2f8f5b;--warn:#b97800;--bad:#c0392b;
  --shadow:0 1px 2px rgba(11,37,69,.04),0 10px 28px rgba(11,37,69,.06)
}
*{box-sizing:border-box}
body{margin:0;font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
/* ---------- hero ---------- */
.hero{background:radial-gradient(1200px 400px at 85% -10%,#ffffff 0%,rgba(255,255,255,0) 60%),linear-gradient(135deg,#d9edfc 0%,#bfe0f8 55%,#a9d3f2 100%);color:var(--navy);padding:34px 24px 96px}
.hero-in{max-width:1180px;margin:0 auto}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:800;letter-spacing:.09em;color:var(--blue)}
.eyebrow .dot{width:9px;height:9px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 3px rgba(29,78,137,.18)}
.hero h1{font-size:30px;font-weight:800;margin:12px 0 10px;letter-spacing:-.01em}
.lead{max-width:680px;margin:0 0 22px;line-height:1.6;color:#2c4a6e;font-size:14px}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{display:flex;align-items:center;gap:9px;padding:10px 16px;border-radius:11px;border:1px solid rgba(11,37,69,.14);background:rgba(255,255,255,.5);color:var(--navy);font:inherit;font-weight:700;font-size:13px;cursor:pointer;transition:.15s}
.tab:hover{background:rgba(255,255,255,.85)}
.tab.on{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 6px 16px rgba(11,37,69,.22)}
.tab svg{flex-shrink:0}
.hero-foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:16px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters label{font-size:12px;font-weight:700;color:#2c4a6e}
.filters select{max-width:190px}
.hero-foot{align-items:flex-start}
.meta{font-size:12px;color:#2c4a6e;margin-top:12px}
.meta b{color:var(--navy)}
/* ---------- conteúdo ---------- */
.wrap{max-width:1180px;margin:-62px auto 40px;padding:0 24px;position:relative}
.card{background:var(--card);border-radius:16px;border:1px solid var(--line);box-shadow:var(--shadow);padding:20px 22px;margin-bottom:16px;min-width:0}
.card-h{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.card h3{margin:0;font-size:16px;font-weight:800}
.card .desc{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.5}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px}
.grid2>.card{margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 16px;box-shadow:var(--shadow)}
.kpi .l{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-size:27px;font-weight:800;margin-top:6px;letter-spacing:-.01em}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.kpi.navy .l,.kpi.navy .s{color:var(--pastel)}
.kpi.warn .v{color:var(--mid)}.kpi.bad .v{color:var(--blue)}.kpi.ok .v{color:#4f86c0}
select,input[type=date],input[type=text],input.search{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:9px;padding:7px 10px;background:#fff;color:var(--text)}
.hero select,.hero input{border-color:rgba(11,37,69,.14)}
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--navy);color:#fff;border:0;border-radius:10px;padding:9px 15px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--blue)}
.btn.light{background:#fff;color:var(--navy);border:1px solid rgba(11,37,69,.14)}
.btn.light:hover{background:var(--baby2)}
.btn.sm{padding:6px 11px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;background:var(--baby);color:var(--navy);border-radius:20px;padding:1px 9px;font-size:12px;font-weight:800;margin-left:6px;vertical-align:1px}
.tbl-wrap{overflow:auto;max-height:540px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:#fff;color:#6b7f99;text-align:left;padding:10px 10px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;border-bottom:1px solid var(--line);z-index:1}
th.fl{top:33px;padding:4px 6px;text-transform:none;font-weight:600;z-index:1}th.fl select{width:100%;max-width:170px;font-size:11.5px;padding:3px 5px}
td{padding:9px 10px;border-bottom:1px solid #eef3f9;white-space:nowrap;max-width:340px;overflow:hidden;text-overflow:ellipsis}
td input[type=text]{width:100%;min-width:130px}
tr:hover td{background:#f6fafe}
.empty{text-align:center;color:#8a9bb2;padding:34px 10px}
.more{font-size:12px;color:var(--muted);padding:10px}
.b{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700;background:var(--baby);color:var(--navy)}
.b.ok{background:#e6f2fc;color:var(--blue)}.b.warn{background:#d4e6f7;color:var(--navy2)}.b.bad{background:var(--blue);color:#fff}.b.navy{background:var(--navy);color:#fff}.b.mid{background:#d9e8f6;color:var(--blue)}.b.gray{background:#eef1f5;color:#61708a}
.seg{display:inline-flex;background:var(--baby2);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;color:var(--navy)}
.seg button.on{background:var(--navy);color:#fff}
.chart-box{position:relative;height:290px}
.uploads{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.up{border:1.5px dashed var(--pastel);background:#fbfdff;border-radius:14px;padding:16px}
.up h4{margin:0 0 4px;font-size:14px}.up p{margin:0 0 10px;color:var(--muted);font-size:12.5px;line-height:1.5}
.up input[type=file]{width:100%;font-size:12px;margin-top:8px}
.up label{font-size:12px;color:var(--muted);font-weight:700}
.note{background:var(--baby2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px;margin-bottom:16px;line-height:1.55}
.note.bad{background:#fbe3e0;border-color:#f3c7c1;color:#7a1f15}
.modal-bg{position:fixed;inset:0;background:rgba(11,37,69,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:18px;max-width:800px;width:100%;max-height:90vh;overflow:auto;padding:24px}
.map-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin:16px 0}
.map-grid label{font-size:12px;font-weight:700;color:var(--muted);display:block;margin-bottom:4px}
.map-grid select{width:100%}
.toast{position:fixed;bottom:20px;right:20px;background:var(--navy);color:#fff;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);z-index:120;display:none;max-width:420px;font-weight:600}
.toast.err{background:var(--bad)}
.timeline{border-left:3px solid var(--pastel);margin:12px 0 0 8px;padding-left:18px}
.ev{margin-bottom:12px;position:relative}
.ev:before{content:'';position:absolute;left:-26px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--navy)}
.ev.m:before{background:var(--sky)}
.ev .d{font-size:12px;color:var(--muted)}
.resp-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.rc{background:linear-gradient(135deg,#e6f3fd,#cfe6f7);border:1px solid #c3def4;border-radius:14px;padding:15px}
.rc .n{font-weight:800}.rc .q{font-size:30px;font-weight:800;margin-top:4px}.rc .s{color:#2c4a6e;font-size:12px}
/* ---------- apresentação ---------- */
#pres{position:fixed;inset:0;background:#000;z-index:100;display:none}
.pstage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.pwrap{display:none;position:absolute;left:50%;top:50%;width:0;height:0}
.pwrap.on{display:block}
.pslide{position:absolute;left:-666.66px;top:-375px;width:1333.33px;height:750px;background:#fff;overflow:hidden;transform-origin:center center;font-family:'Aptos Display','Aptos','Segoe UI Variable Display','Segoe UI',Calibri,Arial,sans-serif;line-height:1.08}
.pe{position:absolute;box-sizing:border-box}
.pe .tx{overflow:hidden;letter-spacing:-.01em}
.pe img{display:block}
.pres-nav{position:absolute;bottom:16px;right:20px;display:flex;gap:8px;z-index:3;opacity:.35;transition:.2s}
.pres-nav:hover{opacity:1}
/* ---------- login ---------- */
body.bloq .hero,body.bloq .wrap{display:none}
#login{display:none;min-height:100vh;align-items:center;justify-content:center;padding:24px;background:radial-gradient(1200px 500px at 85% -10%,#fff 0%,rgba(255,255,255,0) 60%),linear-gradient(135deg,#d9edfc 0%,#bfe0f8 55%,#a9d3f2 100%)}
body.bloq #login{display:flex}
.lcard{background:#fff;border-radius:20px;box-shadow:0 20px 50px rgba(11,37,69,.14);padding:34px 32px;width:100%;max-width:400px}
.lcard h1{font-size:24px;margin:12px 0 6px}
.lcard label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:16px 0 6px}
.lcard input{width:100%;padding:11px 12px;font-size:14px}
.lcard .btn{width:100%;justify-content:center;margin-top:20px;padding:12px}
.lcard .link{background:none;border:0;color:var(--blue);font:inherit;font-size:13px;font-weight:700;cursor:pointer;margin-top:14px;padding:0}
.lmsg{font-size:13px;margin-top:14px;line-height:1.5;color:var(--muted)}
.lmsg.err{color:var(--bad)}
.user{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:#2c4a6e}
@media(max-width:760px){.hero{padding:26px 16px 86px}.wrap{padding:0 16px}.grid2{grid-template-columns:1fr}.map-grid{grid-template-columns:1fr}.hero h1{font-size:25px}}
</style>
</head>
<body class="bloq">
<div id="login"><div class="lcard" id="lcard"></div></div>
<header class="hero"><div class="hero-in">
  <div class="eyebrow"><span class="dot"></span>ÁGUAS DO RIO · JURÍDICO</div>
  <h1>Cumprimento de Obrigações</h1>
  <p class="lead">Acompanha cada requisição de obrigação de fazer do Projuris até a finalização: triagem e abertura de OS pelo Grupo 1, execução das OSs no SCAE e no Field com o Grupo 2, e o retorno aos escritórios.</p>
  <nav class="tabs" id="nav"></nav>
  <div class="hero-foot">
    <div class="filters">
      <label>SUP</label><select id="fSup" onchange="setFilt()"></select>
      <label>Escritório</label><select id="fEsc" onchange="setFilt()"></select>
      <label>Tipo</label><select id="fTipo" onchange="setFilt()"><option value="">Todos</option><option value="dec">Decisões</option><option value="rio">Decisões – [RIO]</option></select>
      <label>Com quem</label><select id="fGrupo" onchange="setFilt()"><option value="">Todos</option><option value="int">Time interno (G1 + G2)</option><option>Grupo 1</option><option>Grupo 2</option><option>Escritório</option><option>Em requisição</option><option>Finalizada</option><option>Encerrada</option><option>Outros</option></select>
      <label>Processo</label><select id="fSit" onchange="setFilt()"></select>
      <label>Responsável</label><select id="fResp" onchange="setFilt()" style="max-width:200px"></select>
      <label>Requisições de</label><input type="date" id="fDe" onchange="setFilt()">
      <label>até</label><input type="date" id="fAte" onchange="setFilt()">
      <button class="btn sm light" onclick="clearFilt()">Limpar</button>
    </div>
    <div class="tools">
      <button class="btn light" onclick="exportTudo()"><span data-i="download"></span>Excel geral</button>
      <button class="btn light" onclick="exportPPT()"><span data-i="download"></span>PPT</button>
      <button class="btn" onclick="apresentar()"><span data-i="play"></span>Apresentar</button>
    </div>
  </div>
  <div class="hero-foot" style="margin-top:10px"><div class="meta" id="meta" style="margin:0">Carregando…</div><div class="user" id="user"></div></div>
</div></header>
<main class="wrap"><div id="alert"></div><div id="view"></div></main>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<div id="pres"></div>

<script>
/* ===================== Conexão ===================== */
const VERSAO = '2026.11.08-d';
const SB_URL = 'https://ouhaiffxwxucmesprbjr.supabase.co';
const SB_KEY = 'sb_publishable_pD8U39Nl4xhC-95t-1FQvw_giOSi7le';
let sb = null;
try { sb = supabase.createClient(SB_URL, SB_KEY); } catch (e) { console.error(e); }

const S = { req:[], proc:[], os:[], hist:[], rev:[], pessoas:[], cargas:[], config:{}, osMap:new Map(), procMap:new Map(),
  histBy:new Map(), reqMap:new Map(), mcache:new Map(), tables:{}, charts:{}, pch:{}, pcfg:{}, gran:{ent:'mes', rev:'mes'},
  filt:{}, escSt:'', baseGrupo:'', pending:null, pi:0, snaps:[], blobs:[], modelo:null };
// paleta única dos gráficos: tons de azul (marinho → azul bebê). warn/bad/ok/gray também são azuis, para nenhum gráfico sair colorido
const C = { navy:'#0b2545', blue:'#1d4e89', mid:'#3a6ea5', sky:'#7fb8e6', pastel:'#a9d3f2', baby:'#cfe6f7', warn:'#7fb8e6', bad:'#1d4e89', ok:'#a9d3f2', gray:'#cfe6f7' };
const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const LIM = { dia:60, semana:26, mes:36 };
const PK = { cob_pessoas:'id', cob_requisicoes:'chave', cob_processos:'chave', cob_historico:'id', cob_os:'os_id', cob_revogacoes:'chave', cob_cargas:'id', cob_config:'chave', cob_snapshots:'data' };

/* ===================== Ícones ===================== */
const ICONS = {
  grid:'<rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/>',
  inbox:'<polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
  target:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
  briefcase:'<rect width="20" height="14" x="2" y="7" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>',
  activity:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
  filex:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="m9.5 12.5 5 5"/><path d="m14.5 12.5-5 5"/>',
  db:'<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/>',
  upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>',
  play:'<polygon points="6 3 20 12 6 21 6 3"/>'
};
const ic = (n, s=17) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]||''}</svg>`;

/* ===================== Utilidades ===================== */
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const isoD = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => isoD(new Date());
const fmt = d => d ? String(d).slice(0,10).split('-').reverse().join('/') : '';
const fmtDT = ts => ts ? new Date(ts).toLocaleString('pt-BR') : '';
const fmtN = n => Number(n).toLocaleString('pt-BR', {maximumFractionDigits:1});
const fmtI = n => Number(n).toLocaleString('pt-BR');
const avg = a => a.reduce((x,y)=>x+y,0) / a.length;
const daysDiff = (a,b) => Math.round((Date.parse(b) - Date.parse(a)) / 864e5);
const normOS = s => String(s ?? '').replace(/\D/g,'').replace(/^0+/,'');
const PART = new Set(['da','de','do','das','dos','e']);
function cleanTxt(v){ return String(v).replace(/\s+$/,'').replace(/^\s+/,''); }
function parseDate(v){
  if (v == null || v === '') return null;
  if (v instanceof Date && !isNaN(v)) return isoD(v);
  if (typeof v === 'number') { const d = XLSX.SSF.parse_date_code(v); return d && d.y > 1900 ? `${d.y}-${pad(d.m)}-${pad(d.d)}` : null; }
  const s = String(v).trim();
  let m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if (m) { let y = +m[3]; if (y < 100) y += 2000; return `${y}-${pad(+m[2])}-${pad(+m[1])}`; }
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  return null;
}
function weekStart(d){ const dt = new Date(d + 'T12:00:00'); dt.setDate(dt.getDate() - ((dt.getDay()+6)%7)); return isoD(dt); }
const gk = (d,g) => g==='mes' ? d.slice(0,7) : g==='semana' ? weekStart(d) : d.slice(0,10);
function glabel(k,g){ if (g==='mes'){ const [y,m]=k.split('-'); return MESES[+m-1]+'/'+y.slice(2); } if (g==='semana') return 'Sem '+fmt(k).slice(0,5); return fmt(k).slice(0,5); }
function serie(rows, field, g){ const m = new Map(); rows.forEach(r => { const d = r[field]; if (!d) return; const k = gk(d,g); m.set(k,(m.get(k)||0)+1); }); return m; }
function groupBy(arr, fn){ const m = new Map(); arr.forEach(x => { const k = fn(x); if (!m.has(k)) m.set(k, []); m.get(k).push(x); }); return m; }

function toast(msg, err=false, keep=false){ const t=document.getElementById('toast'); t.textContent=msg; t.className='toast'+(err?' err':''); t.style.display='block'; clearTimeout(S.tt); if(!keep) S.tt=setTimeout(()=>t.style.display='none', err?9000:5000); }
function hideToast(){ document.getElementById('toast').style.display='none'; }
function modal(html){ document.getElementById('modal').innerHTML=html; document.getElementById('modalBg').style.display='flex'; }
function closeModal(){ document.getElementById('modalBg').style.display='none'; S.pending=null; }
const V = html => document.getElementById('view').innerHTML = html;
const kpi = (l,v,s='',cls='') => `<div class="kpi ${cls}"><div class="l">${esc(l)}</div><div class="v">${esc(typeof v==='number'?fmtI(v):v)}</div><div class="s">${esc(s)}</div></div>`;
const B = (t,cls='') => `<span class="b ${cls}">${esc(t)}</span>`;
const GRUPOS = { 'Grupo 1':'navy', 'Grupo 2':'mid', 'Escritório':'warn', 'Finalizada':'ok', 'Encerrada':'gray', 'Em requisição':'', 'Outros':'gray' };
const bG = g => B(g, GRUPOS[g]||'');
const cardH = (t, d='', tools='') => `<div class="card-h"><div><h3>${esc(t)}</h3>${d?`<div class="desc">${d}</div>`:''}</div>${tools}</div>`;

/* ===================== Supabase ===================== */
function erroTxt(e){ // texto legível de um erro do Supabase/PostgREST
  if (!e) return 'erro desconhecido';
  if (typeof e === 'string') return e;
  const partes = [e.message, e.details, e.hint, e.code && `código ${e.code}`, e.status && `HTTP ${e.status}`].filter(Boolean);
  return partes.length ? partes.join(' · ') : (()=>{ try { return JSON.stringify(e); } catch (x) { return String(e); } })();
}
async function fetchAll(t){
  // 1ª página já traz o total (GET, para o erro vir com mensagem — HEAD não traz texto)
  const first = await sb.from(t).select('*', {count:'exact'}).order(PK[t]).range(0, 999);
  if (first.error) { const e = first.error; e.status = first.status; e.tabela = t; throw e; }
  const out = [...first.data], pages = Math.ceil((first.count || first.data.length) / 1000);
  for (let i=1; i<pages; i+=6) {
    const res = await Promise.all(Array.from({length:Math.min(6, pages-i)}, (_,j) => sb.from(t).select('*').order(PK[t]).range((i+j)*1000, (i+j)*1000+999)));
    res.forEach(r => { if (r.error) { const e = r.error; e.status = r.status; e.tabela = t; throw e; } out.push(...r.data); });
  }
  return out;
}
async function batches(table, rows, conflict, mode){
  const size = 500, chunks = [];
  for (let i=0; i<rows.length; i+=size) chunks.push(rows.slice(i, i+size));
  let done = 0;
  for (let i=0; i<chunks.length; i+=3) {
    const res = await Promise.all(chunks.slice(i, i+3).map(c => mode==='upsert' ? sb.from(table).upsert(c, {onConflict:conflict}) : sb.from(table).insert(c)));
    res.forEach(r => { if (r.error) throw r.error; });
    done += chunks.slice(i, i+3).reduce((a,c)=>a+c.length, 0);
    toast(`Gravando ${fmtI(done)} de ${fmtI(rows.length)}…`, false, true);
  }
}
async function novaCarga(tipo, arquivo, dataRef, linhas, novas, alteradas){
  const { data, error } = await sb.from('cob_cargas').insert({tipo, arquivo, data_referencia:dataRef, linhas, novas, alteradas}).select().single();
  if (error) throw error; return data;
}

/* ===================== Equipe / regras ===================== */
function prepPessoas(){
  S.mcache = new Map();
  S.pessoas.forEach(p => {
    const sig = norm(p.nome).split(' ').filter(t=>t && !PART.has(t)), keys = [];
    if (sig.length) keys.push(sig);
    if (sig.length > 1) { keys.push([sig[0],sig[1]]); keys.push([sig[0],sig[sig.length-1]]); }
    String(p.apelidos||'').split(/[,;]/).map(norm).filter(Boolean).forEach(a => { const t = a.split(' ').filter(x=>!PART.has(x)); if (t.length) keys.push(t); });
    p._keys = keys;
    p._sups = String(p.superintendencias||'').split(/[,;]/).map(norm).filter(Boolean);
  });
}
function matchPessoas(txt){
  if (!txt) return [];
  if (S.mcache.has(txt)) return S.mcache.get(txt);
  const segs = String(txt).split(/[,;\n\t|]+/).map(s => new Set(norm(s).split(' ').filter(Boolean))).filter(s=>s.size);
  const res = S.pessoas.filter(p => p.ativo !== false && p._keys && segs.some(set => p._keys.some(k => k.every(w => set.has(w)))));
  S.mcache.set(txt, res);
  return res;
}
function g2PorSup(sup){
  const n = norm(sup); if (!n) return null; const nt = n.split(' ');
  return S.pessoas.find(p => p.grupo==='Grupo 2' && p.ativo!==false && p._sups.some(s => n===s || s.split(' ').every(w=>nt.includes(w)))) || null;
}
function categoria(t){ const n = norm(t); if (/\bacordo\b/.test(n)) return 'Acordo'; if (/liminar|tutela/.test(n)) return 'Liminar'; if (/revoga/.test(n)) return 'Revogação'; return 'Demais'; }
function derivaGrupo(r, ms){
  const st = norm(r.status);
  if (/reprovad|cancelad/.test(st)) return 'Encerrada';
  if (/finaliz/.test(st)) return 'Finalizada';
  if (st.includes('aprova')) return ms.length ? 'Grupo 1' : 'Outros';
  if (/execucao|informac/.test(st)) {
    if (ms.some(p=>p.grupo==='Grupo 2')) return 'Grupo 2';
    if (ms.length) return 'Grupo 1';
    return 'Escritório';
  }
  if (/executad/.test(st)) return 'Escritório';
  if (/requisic/.test(st)) return 'Em requisição';
  if (r.data_finalizacao) return 'Finalizada';
  return 'Outros';
}
function respDisplay(r, ms, g){
  if (g==='Finalizada' || g==='Encerrada') return '—';
  if (g==='Grupo 1') return ms.length >= 3 ? 'Grupo 1' : ms.map(p=>p.nome).join(', ');
  if (g==='Grupo 2') { const p = ms.find(x=>x.grupo==='Grupo 2'); return p ? p.nome : 'Grupo 2'; }
  return r.usuario_responsavel_raw || '—';
}
const osExec = o => !!o && (/execut/.test(norm(o.ocorrencia)) || norm(o.status_field)==='finalizada');
const osEncSemExec = o => !!o && !osExec(o) && (!!o.data_encerramento || /encerrad|cancelad/.test(norm(o.status_field)));
function prazoField(o){
  if (!o || !o.field_fim_sla) return '';
  const fim = /finaliz|encerrad|cancelad/.test(norm(o.status_field)) ? (o.field_data || o.data_encerramento || today()) : today();
  return fim <= o.field_fim_sla ? 'Dentro do prazo' : 'Fora do prazo';
}
function osSit(r){
  if (!r._osIds.length) return 'Sem OS informada';
  if (!r._osAll.length) return 'OS não localizada no SCAE/Field';
  if (r._osExec.length) return 'Executada';
  if (r._osEnc.length) return 'Encerrada sem execução';
  return 'Em aberto';
}
function enrich(r){
  const p = S.procMap.get(r.chave) || {};
  r._sup = p.superintendencia || ''; r._proc = p.processo || ''; r._mat = p.matricula || r.matricula_os1 || '';
  r._sit = p.situacao_processo || ''; r._esc = p.advogado_interno || ''; r._causa = p.causa_raiz_1 || '';
  const ms = matchPessoas(r.usuario_responsavel_raw);
  r._team = ms.length > 0;
  r._grupo = derivaGrupo(r, ms);
  r._resp = respDisplay(r, ms, r._grupo);
  // Grupo 2: a responsável é a ponto focal da SUP do processo; o nome no Projuris fica registrado à parte
  const g2Nome = ms.find(x=>x.grupo==='Grupo 2') || null;
  r._g2 = r._grupo==='Grupo 2' ? (g2PorSup(r._sup) || g2Nome) : null;
  r._g2Projuris = r._grupo==='Grupo 2' && g2Nome ? g2Nome.nome : '';
  r._div = !!(r._g2 && g2Nome && r._g2.nome !== g2Nome.nome);
  if (r._g2) r._resp = r._g2.nome;
  r._cat = categoria(r.titulo);
  r._osIds = [...new Set(String(r.os_lista || r.numero_os || '').split(/[;,\s]+/).map(normOS).filter(Boolean))];
  r._osAll = r._osIds.map(i=>S.osMap.get(i)).filter(Boolean);
  r._osExec = r._osAll.filter(osExec).sort((a,b)=>String(b.data_encerramento||b.field_data||'').localeCompare(String(a.data_encerramento||a.field_data||'')));
  r._osEnc = r._osAll.filter(osEncSemExec);
  r._os = r._osExec[0] || r._osEnc[0] || r._osAll[0] || null;
  r._prazoFatal = r.prazo_fatal || r.prazo_fatal_processo || null;
  r._diasG1 = r.data_requisicao && r.data_abertura_os1 ? daysDiff(r.data_requisicao, r.data_abertura_os1) : null;
  if (r._diasG1 != null && r._diasG1 < 0) r._diasG1 = null;
  const ev = S.histBy.get(r.chave); const last = ev && ev.length ? ev[ev.length-1].data_evento : (r.data_ultima_aprovacao || r.data_requisicao);
  r._diasFase = last ? daysDiff(last, today()) : null;
  r._diasAberto = r.data_requisicao ? daysDiff(r.data_requisicao, r.data_finalizacao || today()) : null;
}

/* ===================== Carga de dados ===================== */
async function load(silent=false){
  if (!silent) toast('Carregando dados…', false, true);
  try {
    if (!sb) throw new Error('Biblioteca do Supabase não carregou.');
    // cada tabela é lida separadamente: uma falha não derruba as outras e o aviso diz qual foi
    const nomes = ['cob_pessoas','cob_config','cob_requisicoes','cob_processos','cob_os','cob_historico','cob_revogacoes','cob_cargas','cob_snapshots'];
    const res = await Promise.allSettled(nomes.map(fetchAll)), d = {}, falhas = [];
    res.forEach((r,i) => { if (r.status === 'fulfilled') d[nomes[i]] = r.value; else { d[nomes[i]] = []; falhas.push([nomes[i], r.reason]); console.error(nomes[i], r.reason); } });
    Object.assign(S, {pessoas:d.cob_pessoas, req:d.cob_requisicoes, proc:d.cob_processos, os:d.cob_os, hist:d.cob_historico, rev:d.cob_revogacoes, cargas:d.cob_cargas.sort((a,b)=>b.id-a.id), snaps:d.cob_snapshots});
    S.config = Object.fromEntries(d.cob_config.map(c=>[c.chave, c.valor]));
    document.getElementById('alert').innerHTML = falhas.length ? `<div class="note bad"><b>Não consegui ler ${falhas.length===1?'uma tabela':falhas.length+' tabelas'} do Supabase.</b> Rode o <b>schema.sql</b> mais recente no SQL Editor e recarregue a página.<ul style="margin:8px 0 0;padding-left:18px">${falhas.map(([t,e])=>`<li><b>${esc(t)}</b>: ${esc(erroTxt(e))}</li>`).join('')}</ul></div>` : '';
  } catch (e) {
    console.error(e);
    document.getElementById('alert').innerHTML = `<div class="note bad"><b>Não consegui ler o Supabase.</b> Detalhe: ${esc(erroTxt(e))}</div>`;
  }
  prep(); fillSup(); render();
  if (!silent) hideToast();
}
function prep(){
  prepPessoas();
  S.osMap = new Map(S.os.map(o=>[o.os_id, o]));
  S.procMap = new Map(S.proc.map(p=>[p.chave, p]));
  S.histBy = groupBy(S.hist, h=>h.chave);
  S.histBy.forEach(a => a.sort((x,y)=>String(x.data_evento).localeCompare(String(y.data_evento)) || x.id-y.id));
  S.reqMap = new Map();
  S.req.forEach(r => { enrich(r); S.reqMap.set(r.chave, r); });
  S.rev.forEach(v => { v._fin = v.data_finalizacao; v._diasFin = v.data_entrada && v.data_finalizacao ? daysDiff(v.data_entrada, v.data_finalizacao) : null; });
  const ult = t => S.cargas.find(c=>c.tipo===t);
  const partes = Object.keys(TIPOS).map(t => { const c = ult(t); return `${esc(TIPOS[t].curto)}: <b>${c ? esc(fmtDT(c.criado_em)) : '—'}</b>`; });
  document.getElementById('meta').innerHTML = 'Última carga · ' + partes.join(' &nbsp;·&nbsp; ') + ` &nbsp;·&nbsp; <span style="opacity:.7">versão ${VERSAO}</span>`;
}
const FILTROS = ['fSup','fEsc','fTipo','fGrupo','fSit','fResp','fDe','fAte'], FKEY = {fSup:'sup', fEsc:'esc', fTipo:'tipo', fGrupo:'grupo', fSit:'sit', fResp:'resp', fDe:'de', fAte:'ate'};
function opcoes(id, valores, rotulo='Todos'){ const el = document.getElementById(id); if (!el) return;
  el.innerHTML = `<option value="">${rotulo}</option>` + valores.map(([k,v])=>`<option value="${esc(k)}">${esc(v)}</option>`).join(''); el.value = S.filt[FKEY[id]] || ''; }
function fillSup(){ // preenche as listas dos filtros com o que existe na base
  const uniq = f => { const m = new Map(); S.req.forEach(r => { const v = f(r); const n = norm(v); if (n && !m.has(n)) m.set(n, v); }); return [...m].sort((a,b)=>a[1].localeCompare(b[1])); };
  opcoes('fSup', uniq(r=>r._sup), 'Todas'); opcoes('fEsc', uniq(r=>r._esc)); opcoes('fSit', uniq(r=>r._sit));
  const resp = new Map(); S.req.forEach(r => { if (['Finalizada','Encerrada'].includes(r._grupo) || !r._resp || r._resp==='—') return; resp.set(r._resp, (resp.get(r._resp)||0)+1); });
  opcoes('fResp', [...resp].sort((a,b)=>a[0].localeCompare(b[0])).map(([k,n])=>[k, `${k} (${n})`]));
}
function setFilt(){ S.filt = {}; FILTROS.forEach(id => S.filt[FKEY[id]] = document.getElementById(id).value); render(); }
function clearFilt(){ FILTROS.forEach(id => document.getElementById(id).value = ''); setFilt(); }
const tipoReq = r => /\brio\b/.test(norm(r.tipo_requisicao)) ? 'rio' : 'dec';
function getReqs(){
  const f = S.filt;
  return S.req.filter(r => (!f.sup || norm(r._sup)===f.sup) && (!f.esc || norm(r._esc)===f.esc) && (!f.sit || norm(r._sit)===f.sit)
    && (!f.tipo || tipoReq(r)===f.tipo) && (!f.resp || r._resp===f.resp)
    && (!f.grupo || (f.grupo==='int' ? ['Grupo 1','Grupo 2'].includes(r._grupo) : r._grupo===f.grupo))
    && (!f.de || (r.data_requisicao && r.data_requisicao>=f.de)) && (!f.ate || (r.data_requisicao && r.data_requisicao<=f.ate)));
}
const filtrosNaoPeriodo = () => ['sup','esc','tipo','grupo','sit','resp'].some(k => S.filt[k]);
function periodoTxt(){
  const f = S.filt; let t = f.de||f.ate ? `Requisições de ${f.de?fmt(f.de):'início'} a ${f.ate?fmt(f.ate):'hoje'}` : 'Todo o período';
  const txt = id => document.getElementById(id)?.selectedOptions[0]?.text || '';
  [['sup','fSup'],['esc','fEsc'],['tipo','fTipo'],['grupo','fGrupo'],['sit','fSit'],['resp','fResp']].forEach(([k,id]) => { if (f[k]) t += ' · ' + txt(id).replace(/ \(\d+\)$/,''); });
  return t;
}

const col = (l,k,f,h) => ({l,k,f,h});
const colD = (l,k) => ({l,k,f:r=>fmt(r[k])});
function cellVal(c,r){ return c.f ? c.f(r) : (r[c.k] ?? ''); }
function tableBlock(id, title, cols, rows, file, desc=''){
  S.tables[id] = {cols, rows, title, file:file||title, view:null};
  return `<div class="card">${cardH(title + '', desc, `<div class="tools"><input class="search" placeholder="Buscar…" oninput="filterTable('${id}',this.value)"><button class="btn sm" onclick="exportTable('${id}')">${ic('download',14)}Excel</button></div>`).replace('</h3>', `<span class="pill">${fmtI(rows.length)}</span></h3>`)}<div class="tbl-wrap" id="tw_${id}">${tableInner(id, rows)}</div></div>`;
}
function tView(id){
  const t = S.tables[id], n = norm(t.q||''), cf = Object.entries(t.cf||{});
  t.view = (!n && !cf.length) ? null : t.rows.filter(r => (!n || norm(t.cols.map(c=>cellVal(c,r)).join(' ')).includes(n)) && cf.every(([i,v]) => String(cellVal(t.cols[i],r))===v));
  return t.view || t.rows;
}
function tableInner(id, rows){
  const t = S.tables[id], {cols} = t, lim = 300;
  if (!t.opts) t.opts = cols.map(c => { const u = new Set(); for (const r of t.rows) { u.add(String(cellVal(c,r))); if (u.size > 40) return null; }
    const a = [...u]; return a.length > 1 && !a.every(v => /^-?[\d.,]*%?$/.test(v)) ? a.sort((x,y)=>x.localeCompare(y,'pt-BR',{numeric:true})) : null; });
  const fil = t.opts.some(Boolean) ? `<tr>${cols.map((c,i)=> t.opts[i] ? `<th class="fl"><select onchange="colFilter('${id}',${i},this.value)"><option value="">Todos</option>${t.opts[i].map(v=>`<option value="${esc(v)}" ${(t.cf||{})[i]===v?'selected':''}>${esc(v||'(vazio)')}</option>`).join('')}</select></th>` : '<th class="fl"></th>').join('')}</tr>` : '';
  const body = rows.slice(0,lim).map(r => `<tr>${cols.map(c=>`<td>${c.h ? c.h(r) : esc(cellVal(c,r))}</td>`).join('')}</tr>`).join('');
  return `<table><thead><tr>${cols.map(c=>`<th>${esc(c.l)}</th>`).join('')}</tr>${fil}</thead><tbody>${body || `<tr><td colspan="${cols.length}" class="empty">Nenhum registro por aqui.</td></tr>`}</tbody></table>${rows.length>lim?`<div class="more">Exibindo ${lim} de ${fmtI(rows.length)}. Use a busca, os filtros ou exporte para ver tudo.</div>`:''}`;
}
function colFilter(id, i, v){ const t = S.tables[id]; t.cf = t.cf || {}; if (v) t.cf[i] = v; else delete t.cf[i]; document.getElementById('tw_'+id).innerHTML = tableInner(id, tView(id)); }
function filterTable(id, q){

function exportTable(id){ const t = S.tables[id]; xlsxDownload([{name:t.title, rows:toObjs(t.cols, t.view||t.rows)}], t.file); }
function xlsxDownload(sheets, file){
  const wb = XLSX.utils.book_new();
  sheets.forEach(s => { const ws = XLSX.utils.json_to_sheet(s.rows.length ? s.rows : [{'Sem registros':''}]); XLSX.utils.book_append_sheet(wb, ws, s.name.replace(/[\\\/?*\[\]:]/g,' ').slice(0,31)); });
  XLSX.writeFile(wb, `${file}_${today()}.xlsx`.replace(/\s+/g,'_'));
}

/* ===================== Cálculos ===================== */
function mensal(R){
  const ks = new Set(); R.forEach(r => { if (r.data_requisicao) ks.add(r.data_requisicao.slice(0,7)); if (r.data_abertura_os1) ks.add(r.data_abertura_os1.slice(0,7)); });
  const lim = today().slice(0,7), keys = [...ks].filter(k=>k<=lim).sort();
  const ent = serie(R,'data_requisicao','mes'), os1 = serie(R,'data_abertura_os1','mes');
  const safra = groupBy(R.filter(r=>r.data_requisicao), r=>r.data_requisicao.slice(0,7));
  return { keys, labels: keys.map(k=>glabel(k,'mes')), ent: keys.map(k=>ent.get(k)||0), os1: keys.map(k=>os1.get(k)||0),
    trat: keys.map(k => (safra.get(k)||[]).filter(r=>r.data_abertura_os1).length),
    tempo: keys.map(k => { const t = (safra.get(k)||[]).map(r=>r._diasG1).filter(v=>v!=null); return t.length ? avg(t) : null; }) };
}
const focoRows = R => R.filter(r => r._grupo==='Grupo 2' && r._osExec.length).sort((a,b)=>String(a._os.data_encerramento||a._os.field_data||'9').localeCompare(String(b._os.data_encerramento||b._os.field_data||'9')));
const ocorrRows = R => R.filter(r => r._grupo==='Grupo 2' && !r._osExec.length && r._osEnc.length);
function triagem(R){
  const g1 = S.pessoas.filter(p=>p.grupo==='Grupo 1' && p.ativo!==false);
  const carga = new Map(g1.map(p=>[p.nome, S.req.filter(r=>r._grupo==='Grupo 1' && r._resp===p.nome).length]));
  return R.filter(r => r._grupo==='Grupo 1' && r._resp==='Grupo 1').sort((a,b)=>String(a.data_requisicao||'').localeCompare(String(b.data_requisicao||''))).map(r => {
    let pool = g1.filter(p=>norm(p.categoria)===norm(r._cat));
    if (!pool.length) pool = g1.filter(p=>norm(p.categoria)==='demais');
    if (!pool.length) pool = g1;
    if (!pool.length) return {...r, _sug:''};
    const best = pool.reduce((a,b) => carga.get(b.nome) < carga.get(a.nome) ? b : a);
    carga.set(best.nome, carga.get(best.nome)+1);
    return {...r, _sug: best.nome};
  });
}
const stEsc = r => { const s = norm(r.status); return s.includes('informac') ? 'Aguardando informações' : s.includes('executad') ? 'Executada' : s.includes('execucao') ? 'Aguardando execução' : (r.status || '—'); };
const ladoGrupo = g => ['Grupo 1','Grupo 2'].includes(g) ? 'Time interno' : g === 'Escritório' ? 'Escritório' : '';
function faseRot(r){ // fase atual, separando time interno × escritório
  if (r._grupo === 'Escritório') return stEsc(r);
  const s = norm(r.status), st = s.includes('aprova') ? 'Aguardando aprovação' : s.includes('informac') ? 'Aguardando informações' : s.includes('execucao') ? 'Aguardando execução' : (r.status||'—');
  const quem = r._grupo === 'Grupo 1' && st !== 'Aguardando aprovação' ? 'Equipe (fora do G2)' : r._grupo;

function duracoesHist(R){ // tempo em cada etapa pelo histórico de cargas
  const out = {};
  R.forEach(r => { const ev = S.histBy.get(r.chave)||[]; ev.forEach((e,i) => {
    const g = e.grupo_novo; if (!['Grupo 1','Grupo 2','Escritório'].includes(g)) return;

    if (ev[i+1]) { if (ev[i+1].grupo_novo !== g) o.fech.push(daysDiff(e.data_evento, ev[i+1].data_evento)); }
    else if (r._grupo === g) o.abert.push(daysDiff(e.data_evento, today()));
  }); });
  const nome = {'Grupo 1':'Time interno · Grupo 1 (triagem e abertura de OS)', 'Grupo 2':'Time interno · Grupo 2 (acompanhamento da OS)', 'Escritório':'Escritório (execução e finalização)'};
  return ['Grupo 1','Grupo 2','Escritório'].map(g => { const o = out[g] || {fech:[], abert:[]}; return {etapa:nome[g], conc:o.fech.length, medio:o.fech.length?fmtN(avg(o.fech)):'—', aberto:o.abert.length, medioAb:o.abert.length?fmtN(avg(o.abert)):'—'}; });
}

function fixRef(ws){
  // algumas exportações declaram ~1 milhão de linhas vazias; recalcula a área usada pelas células reais
  let mr = -1, mc = -1;
  for (const k in ws) { if (k[0]==='!') continue; const c = XLSX.utils.decode_cell(k); if (c.r > mr) mr = c.r; if (c.c > mc) mc = c.c; }
  if (mr < 0) return false;
  ws['!ref'] = XLSX.utils.encode_range({s:{r:0,c:0}, e:{r:mr,c:mc}});
  return true;
}
function parseWs(ws, fields){
  if (!fixRef(ws)) return null;
  const a = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:'', blankrows:false});
  let hi = a.findIndex(r => r.filter(c=>String(c).trim()!=='').length >= 3); if (hi < 0) hi = 0;
  const seen = {};
  const headers = (a[hi]||[]).map((h,i) => { let x = String(h).trim() || `Coluna ${i+1}`; if (seen[x]) x += ` (${++seen[x]})`; else seen[x] = 1; return x; });
  const rows = a.slice(hi+1).filter(r=>r.some(c=>String(c).trim()!=='')).map(r => { const o = {}; headers.forEach((h,i)=>o[h]=r[i]); return o; });
  return {headers, rows, score: fields ? Object.keys(detect(headers, fields)).length : 0};
}
async function readSheet(file, fields){
  const buf = new Uint8Array(await file.arrayBuffer());
  const binario = (buf[0]===0x50 && buf[1]===0x4B) || (buf[0]===0xD0 && buf[1]===0xCF);
  let wb;
  if (binario) wb = XLSX.read(buf, {type:'array'});
  else {
    let txt; try { txt = new TextDecoder('utf-8', {fatal:true}).decode(buf); } catch (e) { txt = new TextDecoder('windows-1252').decode(buf); }
    wb = XLSX.read(txt.replace(/^\uFEFF/,''), {type:'string', raw:true});
  }
  // lê todas as abas e escolhe a que tem mais colunas reconhecidas (desempate: mais linhas)
  const sheets = [];
  wb.SheetNames.forEach(n => { const d = parseWs(wb.Sheets[n], fields); if (d) sheets.push({name:n, ...d}); });
  if (!sheets.length) return {headers:[], rows:[], sheets:[], sheet:''};
  const best = sheets.reduce((a,b) => (b.score > a.score || (b.score===a.score && b.rows.length > a.rows.length)) ? b : a);
  return {headers:best.headers, rows:best.rows, sheets, sheet:best.name};
}
function detect(headers, fields){
  const nh = headers.map(h=>norm(h)), used = new Set(), map = {};
  const score = (h,s) => h===s ? 3 : (' '+h+' ').startsWith(' '+s+' ') ? 2 : (' '+h+' ').includes(' '+s+' ') ? 1 : 0;
  [3,2,1].forEach(lv => fields.forEach(([k,,syns]) => {
    if (map[k]) return;
    for (const s of syns) { const i = nh.findIndex((h,j)=>!used.has(j) && score(h,s)===lv); if (i>=0) { map[k] = headers[i]; used.add(i); return; } }
  }));
  return map;
}

async function apagarCarga(){
  const {id, st, n} = S.apCarga || {}, c = S.cargas.find(x=>x.id===id), btn = document.getElementById('apcOk'); if (!c) return;
  btn.disabled = true; btn.textContent = 'Apagando…';
  try {
    const tb = TAB_CARGA[c.tipo], pk = PK[tb];
    if (c.tipo==='req') { const r = await sb.from('cob_historico').delete().eq('carga_id', id); if (r.error) throw r.error; }
    if (st) {
      let feito = 0;
      for (;;) { // em lotes, para não estourar o tempo limite do banco
        const sel = await sb.from(tb).select(pk).eq('atualizado_em', st).order(pk).range(0, c.tipo==='field' ? 0 : 299);
        if (c.tipo==='field') {
          const all = []; for (let i=0;;i+=1000) { const q = await sb.from(tb).select(pk+',tipo_os,data_abertura').eq('atualizado_em', st).order(pk).range(i,i+999); if (q.error) throw q.error; all.push(...q.data); if (q.data.length<1000) break; }
          const solo = all.filter(o=>!o.tipo_os && !o.data_abertura).map(o=>o[pk]), resto = all.filter(o=>o.tipo_os || o.data_abertura).map(o=>o[pk]);
          for (let i=0;i<solo.length;i+=300) { const r = await sb.from(tb).delete().in(pk, solo.slice(i,i+300)); if (r.error) throw r.error; }
          for (let i=0;i<resto.length;i+=300) { const r = await sb.from(tb).update(Object.fromEntries(COLS_FIELD.map(k=>[k,null]))).in(pk, resto.slice(i,i+300)); if (r.error) throw r.error; }
          feito = all.length; break;
        }
        if (sel.error) throw sel.error; if (!sel.data.length) break;
        const del = await sb.from(tb).delete({count:'exact'}).in(pk, sel.data.map(o=>o[pk]));
        if (del.error) throw del.error;
        if (!del.count) throw new Error('o banco não permitiu apagar (sem permissão de exclusão). Rode o schema.sql mais recente ou libere DELETE para usuários logados.');
        feito += del.count; toast(`Apagando… ${fmtI(feito)} de ${fmtI(n)}`, false, true);
      }
    }
    const r = await sb.from('cob_cargas').delete().eq('id', id); if (r.error) throw r.error;
    closeModal(); toast('Atualizando a plataforma…', false, true); await load(true);
    toast(`✔ Carga apagada: ${TIPOS[c.tipo]?.t||c.tipo} · ${c.arquivo||''}.`);
  } catch (e) { console.error(e); btn.disabled = false; btn.textContent = 'Apagar carga'; toast('Erro ao apagar a carga: '+erroTxt(e), true); }
}

const osExtras = headers => headers.filter(h => /^ordem de servico [2-9]$/.test(norm(h)));
function buildRecs(P){
  const g = (o,k) => { const h = P.map[k]; if (!h) return null; const v = o[h]; return v==null || String(v).trim()==='' ? null : v; };
  const val = (o,k) => { const v = g(o,k); if (v==null) return null; return DATES.has(k) ? parseDate(v) : cleanTxt(v); };
  const pick = (o, ks) => { const r = {}; ks.forEach(k => r[k] = val(o,k)); return r; };
  const out = new Map(), F = TIPOS[P.tipo].fields.map(f=>f[0]);
  if (P.tipo==='req') {
    const extras = osExtras(P.headers);
    P.rows.forEach(o => {
      const r = pick(o, F.filter(k=>k!=='usuario_responsavel'));
      if (!r.numero_requisicao) return;
      r.chave = r.numero_requisicao;
      r.usuario_responsavel_raw = val(o,'usuario_responsavel');
      if (!normOS(r.numero_os)) r.numero_os = null;
      const ids = [r.numero_os, ...extras.map(h=>o[h])].map(normOS).filter(Boolean);
      r.os_lista = ids.length ? [...new Set(ids)].join(';') : null;
      r.qtd_os = ids.length ? new Set(ids).size : 0;
      const ms = matchPessoas(r.usuario_responsavel_raw);
      r.grupo = derivaGrupo(r, ms); r.usuario_responsavel = respDisplay(r, ms, r.grupo); r.categoria = categoria(r.titulo);
      out.set(r.chave, r);
    });
  } else if (P.tipo==='proc' || P.tipo==='rev') {
    P.rows.forEach(o => { const r = pick(o, F); if (!r.numero_requisicao) return; r.chave = r.numero_requisicao; if (P.tipo==='proc') delete r.numero_requisicao; out.set(r.chave, r); });
  } else if (P.tipo==='scae') {
    const team = document.getElementById('mpTeam')?.checked !== false;
    P.rows.forEach(o => {
      const r = pick(o, F); const id = normOS(r.numero_os); if (!id) return;
      if (team && !matchPessoas(r.aberto_por).length) return;
      r.os_id = id; r.data_execucao = /execut/.test(norm(r.ocorrencia)) ? r.data_encerramento : null;
      out.set(id, r);
    });
  } else {
    P.rows.forEach(o => { const r = pick(o, F); const id = normOS(r.numero_os); if (!id) return; r.os_id = id; out.set(id, r); });
  }
  return [...out.values()];
}
function diff(oldMap, recs, key, keys){
  const up = [], changed = []; let novas = 0, alt = 0, ig = 0;
  recs.forEach(r => { const o = oldMap.get(r[key]);
    if (!o) { novas++; up.push(r); changed.push([r,null]); }
    else if (keys.some(k => String(o[k]??'') !== String(r[k]??''))) { alt++; up.push(r); changed.push([r,o]); }
    else ig++; });
  return {up, changed, novas, alteradas:alt, iguais:ig};
}
async function confirmMapping(){
  const P = S.pending, btn = document.getElementById('mpOk');
  btn.disabled = true; btn.textContent = 'Importando…';
  const recs = buildRecs(P), dataRef = document.getElementById('dt_'+P.tipo)?.value || today(), now = new Date().toISOString();
  try {
    await sb.from('cob_config').upsert({chave:'map_'+P.tipo, valor:P.map, atualizado_em:now}, {onConflict:'chave'});
    let res;
    if (P.tipo==='req') {
      res = diff(new Map(S.req.map(r=>[r.chave,r])), recs, 'chave', KEYS.req);
      const fechado = g => g==='Finalizada' || g==='Encerrada';
      const hist = res.changed.filter(([r,o]) => o ? ['status','usuario_responsavel','grupo'].some(k=>String(o[k]??'')!==String(r[k]??'')) : !fechado(r.grupo))
        .map(([r,o]) => ({chave:r.chave, data_evento:dataRef, status_anterior:o?.status??null, status_novo:r.status, usuario_anterior:o?.usuario_responsavel??null, usuario_novo:r.usuario_responsavel, grupo_anterior:o?.grupo??null, grupo_novo:r.grupo}));
      const carga = await novaCarga(P.tipo, P.fname, dataRef, recs.length, res.novas, res.alteradas);
      // histórico antes das requisições: se a carga cair no meio, repetir não perde nem duplica mudanças
      hist.forEach(h => h.carga_id = carga.id);
      await batches('cob_historico', hist, 'chave,data_evento', 'upsert');
      res.up.forEach(r => r.atualizado_em = now);
      await batches('cob_requisicoes', res.up, 'chave', 'upsert');
    } else {
      const cfg = { proc:['cob_processos','chave',S.proc], rev:['cob_revogacoes','chave',S.rev], scae:['cob_os','os_id',S.os], field:['cob_os','os_id',S.os] }[P.tipo];
      res = diff(new Map(cfg[2].map(r=>[r[cfg[1]], r])), recs, cfg[1], KEYS[P.tipo]);
      await novaCarga(P.tipo, P.fname, dataRef, recs.length, res.novas, res.alteradas);
      res.up.forEach(r => r.atualizado_em = now);
      await batches(cfg[0], res.up, cfg[1], 'upsert');
    }
    closeModal(); toast('Atualizando a plataforma…', false, true); await load(true);
    if (P.tipo==='req' || P.tipo==='proc') await salvarSnap(P.tipo==='req' ? dataRef : refDate());
    toast(`✔ ${TIPOS[P.tipo].t}: ${fmtI(res.novas)} novos, ${fmtI(res.alteradas)} alterados, ${fmtI(res.iguais)} sem mudança.`);
  } catch (e) { console.error(e); btn.disabled = false; btn.textContent = 'Importar'; toast('Erro na importação: '+erroTxt(e), true); }
}

  const esc = {}, int = {dec:{exec:0,info:0}, rio:{exec:0,info:0}};

    const st = norm(r.status), s = st.includes('informac') ? 'info' : st.includes('execucao') ? 'exec' : null;

/* ---- edição do XML dos slides ---- */
const XML_DECL = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\r\n';
const parseXml = s => new DOMParser().parseFromString(s, 'application/xml');
const serXml = d => { const s = new XMLSerializer().serializeToString(d); return s.startsWith('<?xml') ? s : XML_DECL + s; };
function shapeEl(doc, name){ for (const c of doc.getElementsByTagName('p:cNvPr')) if (c.getAttribute('name') === name) { let e = c; while (e && e.nodeName !== 'p:sp' && e.nodeName !== 'p:pic') e = e.parentNode; return e; } return null; }
const runsOf = el => el ? [...el.getElementsByTagName('a:t')] : [];
function ajustaFonte(sp, antes, depois){ // texto novo mais longo: reduz a fonte para não quebrar linha
  if (!sp || depois <= antes) return; const f = Math.max(0.7, antes/depois*0.96);
  for (const tag of ['a:rPr','a:endParaRPr','a:defRPr']) for (const r of sp.getElementsByTagName(tag)) { const z = r.getAttribute('sz'); if (z) r.setAttribute('sz', String(Math.round(+z*f/100)*100)); }
}
function trocaJunto(doc, name, re, novo){ const sp = shapeEl(doc, name), r = runsOf(sp); if (!r.length) return; const j = r.map(t=>t.textContent).join(''); if (!re.test(j)) return;
  const n = j.replace(re, novo); r[0].textContent = n; r.slice(1).forEach(t => t.textContent = ''); ajustaFonte(sp, j.length, n.length); }
function trocaRuns(doc, name, fn){ runsOf(shapeEl(doc, name)).forEach((t,i) => { const v = fn(t.textContent, i); if (v != null) t.textContent = v; }); }

  const dif = [ex.d, inf.d]; let k = 0; const sp = shapeEl(doc, name), linhas = () => [...(sp ? sp.getElementsByTagName('a:p') : [])].map(p => runsOf(p).map(t=>t.textContent).join('').length);

function idb(){ return new Promise((res,rej) => { const q = indexedDB.open('cob', 1); q.onupgradeneeded = () => q.result.createObjectStore('kv'); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }

async function getModelo(){

  return null;
}

  const buf = await getModelo(); if (!buf) return null;
  const zip = await JSZip.loadAsync(buf, {createFolders:false}), D = dadosModelo();
  D.prevUse = D.prev || D.cur;
  const slides = await ordemSlides(zip);
  for (let n = 1; n <= slides.length; n++) {
    const path = slides[n-1], relPath = path.replace('slides/', 'slides/_rels/') + '.rels';
    const doc = parseXml(await zip.file(path).async('string'));
    const rels = {}; if (zip.file(relPath)) for (const r of parseXml(await zip.file(relPath).async('string')).getElementsByTagName('Relationship')) rels[r.getAttribute('Id')] = r.getAttribute('Target');
    for (const pic of [...doc.getElementsByTagName('p:pic')]) {
      const nome = pic.getElementsByTagName('p:cNvPr')[0]?.getAttribute('name'), fn = IMGS[`${n}:${nome}`]; if (!fn) continue;
      const blip = pic.getElementsByTagName('a:blip')[0], alvo = rels[blip.getAttribute('r:embed')]; if (!alvo) continue;
      const ext = pic.getElementsByTagName('a:xfrm')[0].getElementsByTagName('a:ext')[0];
      const w = +ext.getAttribute('cx')/914400, h = +ext.getAttribute('cy')/914400;
      const media = 'ppt/' + alvo.replace(/^\.\.\//,'');
      zip.file(media, fn(D, w, h).split(',')[1], {base64:true, createFolders:false});
      const sr = pic.getElementsByTagName('a:srcRect')[0]; if (sr) sr.parentNode.removeChild(sr);
    }
    if (TEXTOS[n]) TEXTOS[n](doc, D);
    zip.file(path, serXml(doc), {createFolders:false});
  }
  return {zip, D};
}
async function ordemSlides(zip){
  const pres = parseXml(await zip.file('ppt/presentation.xml').async('string')), rel = parseXml(await zip.file('ppt/_rels/presentation.xml.rels').async('string'));
  const m = {}; for (const r of rel.getElementsByTagName('Relationship')) m[r.getAttribute('Id')] = r.getAttribute('Target');
  return [...pres.getElementsByTagName('p:sldId')].map(s => 'ppt/' + m[s.getAttribute('r:id')].replace(/^\//,'').replace(/^ppt\//,''));
}
async function exportPPT(){
  try {
    toast('Montando o PPT…', false, true);
    const g = await gerarDeck(); if (!g) { hideToast(); return pedirModelo(exportPPT); }
    await salvarSnap(g.D.ref);
    const blob = await g.zip.generateAsync({type:'blob', compression:'DEFLATE', mimeType:'application/vnd.openxmlformats-officedocument.presentationml.presentation'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `Apresentação Reunião Semanal ${fmt(g.D.ref).replace(/\//g,'-')}.pptx`; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast(g.D.prev ? `✔ PPT gerado (dados até ${fmt(g.D.ref)}, comparado com ${fmt(g.D.prev.data)}).` : `✔ PPT gerado. Ainda não há foto da semana anterior para os percentuais.`);
  } catch (e) { console.error(e); toast('Erro ao gerar o PPT: ' + (e.message||e), true); }
}

/* ---- modo Apresentar: mostra os mesmos slides do PPT gerado ---- */
const EMU = 9144; // EMU por px (100 px por polegada)
function corTema(doc){ const m = {}; const cs = doc.getElementsByTagName('a:clrScheme')[0]; if (!cs) return m;
  for (const c of cs.children) { const k = c.nodeName.replace('a:',''), s = c.getElementsByTagName('a:srgbClr')[0] || c.getElementsByTagName('a:sysClr')[0];
    if (s) m[k] = s.getAttribute('val') && s.nodeName==='a:srgbClr' ? s.getAttribute('val') : (s.getAttribute('lastClr') || '000000'); }
  Object.assign(m, {tx1:m.dk1, bg1:m.lt1, tx2:m.dk2, bg2:m.lt2}); return m; }
function resolveCor(el, tema){
  if (!el) return null; const c = [...el.children].find(x => ['a:srgbClr','a:schemeClr','a:sysClr'].includes(x.nodeName)); if (!c) return null;
  let hex = c.nodeName === 'a:srgbClr' ? c.getAttribute('val') : c.nodeName === 'a:sysClr' ? (c.getAttribute('lastClr')||'000000') : tema[c.getAttribute('val')] || '000000';
  const mod = c.getElementsByTagName('a:lumMod')[0], off = c.getElementsByTagName('a:lumOff')[0];
  if (mod || off) { let [r,g,b] = [0,2,4].map(i=>parseInt(hex.substr(i,2),16)/255); const mx = Math.max(r,g,b), mn = Math.min(r,g,b); let h = 0, s = 0, l = (mx+mn)/2;
    if (mx !== mn) { const d = mx-mn; s = l > .5 ? d/(2-mx-mn) : d/(mx+mn); h = mx===r ? (g-b)/d + (g<b?6:0) : mx===g ? (b-r)/d + 2 : (r-g)/d + 4; h /= 6; }
    l = Math.min(1, Math.max(0, l*(mod ? +mod.getAttribute('val')/1e5 : 1) + (off ? +off.getAttribute('val')/1e5 : 0)));
    const q = l < .5 ? l*(1+s) : l+s-l*s, p = 2*l-q, f = t => { t = (t+1)%1; return t < 1/6 ? p+(q-p)*6*t : t < .5 ? q : t < 2/3 ? p+(q-p)*(2/3-t)*6 : p; };
    hex = [h+1/3, h, h-1/3].map(t => Math.round((s ? f(t) : l)*255).toString(16).padStart(2,'0')).join(''); }
  const a = c.getElementsByTagName('a:alpha')[0];
  return a ? `rgba(${parseInt(hex.substr(0,2),16)},${parseInt(hex.substr(2,2),16)},${parseInt(hex.substr(4,2),16)},${+a.getAttribute('val')/1e5})` : '#' + hex;
}
const filho = (el, nome) => el ? [...el.children].find(c => c.nodeName === nome) : null;
function preenchTexto(pr, tema){ // cor (ou degradê) de um rPr/defRPr
  if (!pr) return null; const sf = filho(pr,'a:solidFill'); if (sf) return {cor:resolveCor(sf, tema)};
  const gf = filho(pr,'a:gradFill'); if (gf) { const cs = [...gf.getElementsByTagName('a:gs')].map(g => resolveCor(g, tema)).filter(Boolean); if (cs.length) return {grad:`linear-gradient(180deg,${cs.join(',')})`, cor:cs[0]}; }
  return null;
}
async function estilosLayout(zip, slidePath, rels, tema){ // estilo herdado dos placeholders do layout (tamanho, negrito, cor, alinhamento)
  const alvo = Object.values(rels).find(t => /slideLayout\d+\.xml$/.test(t)); if (!alvo) return {};
  const f = zip.file('ppt/slideLayouts/' + alvo.split('/').pop()); if (!f) return {};
  const doc = parseXml(await f.async('string')), m = {};
  for (const sp of doc.getElementsByTagName('p:sp')) {
    const ph = sp.getElementsByTagName('p:ph')[0]; if (!ph) continue;
    const lv = sp.getElementsByTagName('a:lvl1pPr')[0], d = lv && filho(lv,'a:defRPr'), bp = sp.getElementsByTagName('a:bodyPr')[0];
    const e = { sz:d?.getAttribute('sz'), b:d?.getAttribute('b'), fill:preenchTexto(d, tema), anchor:bp?.getAttribute('anchor'), algn:lv?.getAttribute('algn') };
    m[ph.getAttribute('idx') || ph.getAttribute('type')] = e;
  }
  return m;
}
async function slidesHTML(zip){
  const tema = corTema(parseXml(await zip.file('ppt/theme/theme1.xml').async('string'))), paths = await ordemSlides(zip), out = [];
  S.blobs.forEach(u => URL.revokeObjectURL(u)); S.blobs = [];
  for (const path of paths) {
    const doc = parseXml(await zip.file(path).async('string')), relPath = path.replace('slides/', 'slides/_rels/') + '.rels', rels = {};
    if (zip.file(relPath)) for (const r of parseXml(await zip.file(relPath).async('string')).getElementsByTagName('Relationship')) rels[r.getAttribute('Id')] = r.getAttribute('Target');
    const tree = doc.getElementsByTagName('p:spTree')[0], els = [], lay = await estilosLayout(zip, path, rels, tema);
    const temFoto = [...tree.children].some(c => c.nodeName === 'p:pic' && +(c.getElementsByTagName('a:xfrm')[0]?.getElementsByTagName('a:ext')[0]?.getAttribute('cx')||0) > 12*914400);
    for (const el of tree.children) {
      const xf = el.getElementsByTagName('a:xfrm')[0]; if (!xf) continue;
      const o = filho(xf,'a:off'), e = filho(xf,'a:ext'); if (!o || !e) continue;
      const box = `left:${+o.getAttribute('x')/EMU}px;top:${+o.getAttribute('y')/EMU}px;width:${+e.getAttribute('cx')/EMU}px;height:${+e.getAttribute('cy')/EMU}px`;
      const flip = `${xf.getAttribute('flipV')==='1'?'scaleY(-1) ':''}${xf.getAttribute('flipH')==='1'?'scaleX(-1) ':''}${xf.getAttribute('rot')?`rotate(${+xf.getAttribute('rot')/60000}deg)`:''}`;
      if (el.nodeName === 'p:pic') {
        const alvo = rels[el.getElementsByTagName('a:blip')[0]?.getAttribute('r:embed')]; const f = alvo && zip.file('ppt/' + alvo.replace(/^\.\.\//,'')); if (!f) continue;
        const url = URL.createObjectURL(await f.async('blob')); S.blobs.push(url);
        const sr = el.getElementsByTagName('a:srcRect')[0], g = k => sr ? (+sr.getAttribute(k) || 0)/1e5 : 0, l = g('l'), t = g('t'), r = g('r'), b = g('b');
        els.push(`<div class="pe" style="${box};overflow:hidden"><img src="${url}" style="position:absolute;left:${-l/(1-l-r)*100}%;top:${-t/(1-t-b)*100}%;width:${100/(1-l-r)}%;height:${100/(1-t-b)}%"></div>`);
        continue;
      }
      if (el.nodeName !== 'p:sp') continue;
      if (el.getElementsByTagName('p:ph')[0] && !el.getElementsByTagName('a:t').length) continue; // placeholder vazio não aparece na apresentação
      const spPr = filho(el,'p:spPr'), geo = spPr && spPr.getElementsByTagName('a:prstGeom')[0]?.getAttribute('prst'), fill = resolveCor(filho(spPr,'a:solidFill'), tema);
      const body = filho(el,'p:txBody'); let html = '';
      if (body) {
        const ph = el.getElementsByTagName('p:ph')[0], L = ph ? (lay[ph.getAttribute('idx') || ph.getAttribute('type')] || {}) : {};
        const corForma = resolveCor(el.getElementsByTagName('a:fontRef')[0], tema); // cor do texto definida pelo estilo da forma
        const bp = filho(body,'a:bodyPr'), anc = bp?.getAttribute('anchor') || L.anchor || 't';
        const ps = [...body.getElementsByTagName('a:p')].map(p => {
          const algn = filho(p,'a:pPr')?.getAttribute('algn') || L.algn; let tx = '';
          for (const r of p.children) {
            if (r.nodeName === 'a:br') { tx += '<br>'; continue; } if (r.nodeName !== 'a:r') continue;
            const pr = filho(r,'a:rPr'), sz = pr?.getAttribute('sz') || L.sz, b = pr?.getAttribute('b') ?? L.b;
            const fl = preenchTexto(pr, tema) || preenchTexto(filho(p,'a:endParaRPr'), tema) || L.fill || (corForma ? {cor:corForma} : {cor: temFoto ? '#fff' : '#404040'});
            const corCss = fl.grad ? `background:${fl.grad};-webkit-background-clip:text;background-clip:text;color:transparent;` : `color:${fl.cor};`;
            tx += `<span style="font-size:${(sz ? +sz/100 : 18)*100/72}px;${b==='1'?'font-weight:700;':''}${corCss}">${esc(filho(r,'a:t')?.textContent||'')}</span>`;
          }
          return tx ? `<div style="text-align:${{ctr:'center',r:'right'}[algn]||'left'}">${tx}</div>` : '';
        }).join('');
        if (ps) html = `<div class="tx" style="display:flex;flex-direction:column;justify-content:${{ctr:'center',b:'flex-end'}[anc]||'flex-start'};height:100%;padding:4px 8px">${ps}</div>`;
      }
      let forma = '';
      if (geo === 'downArrow' && fill) forma = `<svg viewBox="0 0 10 20" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%"><path d="M3 0h4v12h3L5 20 0 12h3z" fill="${fill}"/></svg>`;
      else if (/curved.*Arrow/i.test(geo||'') && fill) forma = `<svg viewBox="0 0 10 40" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%"><path d="M10 0C2 4 1 22 6 32L4 33l6 7 0-10-2 1C4 22 5 6 10 3z" fill="${fill}"/></svg>`;
      if (!html && !forma && !fill) continue;
      const bg = !forma && fill ? `background:${fill};${geo==='roundRect'?'border-radius:18px;':''}` : '';
      els.push(`<div class="pe" style="${box};${bg}${flip?`transform:${flip};`:''}">${forma}${html}</div>`);
    }
    out.push(`<div class="pslide">${els.join('')}</div>`);
  }
  return out;
}
async function apresentar(){
  try {
    toast('Montando a apresentação…', false, true);
    const g = await gerarDeck(); if (!g) { hideToast(); return pedirModelo(apresentar); }
    const sl = await slidesHTML(g.zip), el = document.getElementById('pres');
    el.innerHTML = `<div class="pstage">${sl.map((s,i)=>`<div class="pwrap${i===0?' on':''}">${s}</div>`).join('')}</div>
      <div class="pres-nav"><button class="btn" onclick="pmove(-1)">◀</button><span id="pnum" class="btn" style="cursor:default"></span><button class="btn" onclick="pmove(1)">▶</button><button class="btn" onclick="exportPPT()">${ic('download',14)}PPT</button><button class="btn" onclick="fecharPres()">✕</button></div>`;
    el.style.display = 'block'; S.pi = 0; pshow(); escala(); hideToast();
    try { el.requestFullscreen && el.requestFullscreen().catch(()=>{}); } catch (e) {}
  } catch (e) { console.error(e); toast('Erro ao montar a apresentação: ' + (e.message||e), true); }
}
function escala(){ const s = Math.min(window.innerWidth/1333.33, window.innerHeight/750); document.querySelectorAll('#pres .pslide').forEach(p => p.style.transform = `scale(${s})`); }
window.addEventListener('resize', () => { if (document.getElementById('pres').style.display === 'block') escala(); });
function caber(wrap){ // reduz o texto que não cabe na caixa (fonte diferente da do PowerPoint)
  if (wrap.dataset.ok) return; wrap.dataset.ok = 1;
  wrap.querySelectorAll('.pe .tx').forEach(tx => { const box = tx.parentElement, spans = [...tx.querySelectorAll('span')];
    for (let i = 0; i < 12 && (tx.scrollHeight > box.clientHeight + 2 || tx.scrollWidth > box.clientWidth + 2); i++) spans.forEach(sp => sp.style.fontSize = (parseFloat(sp.style.fontSize)*0.94) + 'px'); });
}
function pshow(){ const sl = [...document.querySelectorAll('#pres .pwrap')]; sl.forEach((s,i) => s.classList.toggle('on', i===S.pi)); caber(sl[S.pi]); document.getElementById('pnum').textContent = `${S.pi+1}/${sl.length}`; }
function pmove(d){ const n = document.querySelectorAll('#pres .pwrap').length; S.pi = Math.min(n-1, Math.max(0, S.pi+d)); pshow(); }
function fecharPres(){ const el = document.getElementById('pres'); el.style.display = 'none'; el.innerHTML = ''; if (document.fullscreenElement) document.exitFullscreen().catch(()=>{}); }
document.addEventListener('keydown', e => {
  if (document.getElementById('pres').style.display !== 'block') return;
  if (e.key==='ArrowRight' || e.key===' ' || e.key==='PageDown') { e.preventDefault(); pmove(1); }
  else if (e.key==='ArrowLeft' || e.key==='PageUp') pmove(-1);
  else if (e.key==='Escape') fecharPres();
});
document.getElementById('modalBg').addEventListener('click', e => { if (e.target.id==='modalBg') closeModal(); });
document.querySelectorAll('[data-i]').forEach(el => el.outerHTML = ic(el.dataset.i, 15));

/* ===================== Login (Supabase Auth) ===================== */
const LOGO = `<div class="eyebrow"><span class="dot"></span>ÁGUAS DO RIO · JURÍDICO</div>`;
function telaLogin(msg='', erro=false){
  document.body.classList.add('bloq');
  document.getElementById('lcard').innerHTML = `${LOGO}<h1>Cumprimento de Obrigações</h1><div class="desc">Entre com seu e-mail e senha.</div>
  <form onsubmit="entrar(event)"><label>E-mail</label><input type="email" id="lEmail" autocomplete="username" required>
  <label>Senha</label><input type="password" id="lSenha" autocomplete="current-password" required>
  <button class="btn" id="lBtn">Entrar</button></form>
  <button class="link" onclick="esqueci()">Esqueci minha senha</button>
  <div class="lmsg ${erro?'err':''}" id="lMsg">${esc(msg)}</div>`;
  setTimeout(()=>document.getElementById('lEmail')?.focus(), 50);
}
function lmsg(t, erro=false){ const m = document.getElementById('lMsg'); if (m) { m.textContent = t; m.className = 'lmsg' + (erro?' err':''); } }
async function entrar(ev){
  ev.preventDefault(); const b = document.getElementById('lBtn'); b.disabled = true; b.textContent = 'Entrando…'; lmsg('');
  const { data, error } = await sb.auth.signInWithPassword({ email:document.getElementById('lEmail').value.trim(), password:document.getElementById('lSenha').value });
  if (error) { b.disabled = false; b.textContent = 'Entrar'; return lmsg(/invalid/i.test(error.message) ? 'E-mail ou senha incorretos.' : 'Não foi possível entrar: ' + error.message, true); }
  await liberar(data.session);
}
async function esqueci(){
  const email = document.getElementById('lEmail')?.value.trim();
  if (!email) return lmsg('Digite seu e-mail acima e clique de novo em "Esqueci minha senha".', true);
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
  lmsg(error ? 'Não foi possível enviar: ' + error.message : 'Se o e-mail estiver cadastrado, você vai receber um link para criar uma nova senha.', !!error);
}
function telaNovaSenha(){
  document.body.classList.add('bloq');
  document.getElementById('lcard').innerHTML = `${LOGO}<h1>Nova senha</h1><div class="desc">Escolha uma senha com pelo menos 8 caracteres.</div>
  <form onsubmit="salvarSenha(event)"><label>Nova senha</label><input type="password" id="nS1" autocomplete="new-password" minlength="8" required>
  <label>Repita a senha</label><input type="password" id="nS2" autocomplete="new-password" minlength="8" required><button class="btn" id="nBtn">Salvar senha</button></form><div class="lmsg" id="lMsg"></div>`;
}
async function salvarSenha(ev){
  ev.preventDefault(); const a = document.getElementById('nS1').value, b = document.getElementById('nS2').value;
  if (a !== b) return lmsg('As senhas não são iguais.', true);
  const { error } = await sb.auth.updateUser({ password:a });
  if (error) return lmsg('Não foi possível salvar: ' + error.message, true);
  history.replaceState(null, '', location.pathname);
  const { data } = await sb.auth.getSession(); await liberar(data.session);
}
async function liberar(session){
  if (!session) return telaLogin();
  const { data:ok, error } = await sb.rpc('cob_autorizado');
  if (error || !ok) { await sb.auth.signOut(); return telaLogin(error ? 'Erro ao verificar acesso: ' + error.message : 'Seu e-mail não está liberado para esta plataforma. Peça a liberação à responsável.', true); }
  S.user = session.user;
  document.getElementById('user').innerHTML = `${esc(session.user.email)} <button class="btn sm light" onclick="sair()">Sair</button>`;
  document.body.classList.remove('bloq');
  if (!S.carregou) { S.carregou = true; buildNav(); await load(); }
}
async function sair(){ await sb.auth.signOut(); location.reload(); }
(async () => {
  if (!sb) { telaLogin('Não foi possível conectar ao Supabase. Recarregue a página.', true); return; }
  if (/type=recovery/.test(location.hash)) S.recuperando = true;
  sb.auth.onAuthStateChange((ev) => { if (ev === 'PASSWORD_RECOVERY') { S.recuperando = true; setTimeout(telaNovaSenha, 0); } });
  const { data } = await sb.auth.getSession();
  if (S.recuperando) return telaNovaSenha();
  if (data.session) await liberar(data.session); else telaLogin();
})();
</script>
